version: '3.8'

services:
  # ====================================
  # Servicio PostgreSQL
  # ====================================
  # Servicio Jenkins (Entorno unificado frontend + backend)
  # ====================================
  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins-unified
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      # Monta el socket para permitir builds docker desde Jenkins
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # Evita el wizard inicial para instalaciones automatizadas
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# ====================================
# Volúmenes
volumes:
  postgres_data:
    driver: local
  jenkins_home:
    driver: local
    # Configuración de logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ====================================
  # Servicio Backend
  # ====================================
  app:
    container_name: movie-bff
    build: 
      context: .
      dockerfile: Dockerfile
    
    ports:
      - "${PORT:-3000}:3000"
    
    environment:
      - DOCKER_ENV=true
      - PORT=3000
      - NODE_ENV=${NODE_ENV:-production}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-movie_bff}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-1234}
      - OMDB_API_KEY=${OMDB_API_KEY:-}
    
    depends_on:
      postgres:
        condition: service_healthy
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# ====================================
# Volúmenes
# ====================================
volumes:
  postgres_data:
    driver: local
  jenkins_home:
    driver: local

# ====================================
# Servicio Jenkins (Entorno unificado frontend + backend)
# ====================================
services:
  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins-unified
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      # Monta el socket para permitir builds docker desde Jenkins
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # Evita el wizard inicial para instalaciones automatizadas
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"