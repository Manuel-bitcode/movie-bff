version: '3.8'

services:
  # ====================================
  # Servicio PostgreSQL
  # ====================================
  postgres:
    image: wilmerleon/movie-bff-postgres:latest
    container_name: movie-bff-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-1234}
      POSTGRES_DB: ${DB_NAME:-movie_bff}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ====================================
  # Servicio Backend
  # ====================================
  app:
    container_name: movie-bff
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - DOCKER_ENV=true
      - PORT=3000
      - NODE_ENV=${NODE_ENV:-production}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-movie_bff}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-1234}
      - OMDB_API_KEY=${OMDB_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ====================================
  # Servicio Jenkins (Entorno unificado frontend + backend)
  # ====================================
  jenkins:
    build:
      context: ./jenkins
      dockerfile: Dockerfile
    container_name: jenkins-unified
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false
      - JENKINS_ADMIN_USER=${JENKINS_ADMIN_USER:-admin}
      - JENKINS_ADMIN_PASSWORD=${JENKINS_ADMIN_PASSWORD:-admin123}
      # Opcionales para la creación automática del Multibranch y credenciales
      - GIT_REPO_URL=${GIT_REPO_URL:-https://github.com/Manuel-bitcode/movie-bff.git}
      - MULTIBRANCH_JOB_NAME=${MULTIBRANCH_JOB_NAME:-movie-bff-multibranch}
      - GIT_CREDENTIALS_ID=${GIT_CREDENTIALS_ID:-github-token}
      - GIT_USERNAME=${GIT_USERNAME:-git}
      # NOTA: no establecer GIT_TOKEN en el archivo, pásalo por variable de entorno en tu shell o CI
      - GIT_TOKEN=${GIT_TOKEN}
  # Usar DOCKER_HOST para conectar al daemon de Docker sobre TCP cuando
  # se expone desde Docker Desktop (host.docker.internal:2375).
  # NOTA: debes habilitar la exposición del daemon en Docker Desktop o
  # en la VM que corre Docker para que esto funcione.
  - DOCKER_HOST=tcp://host.docker.internal:2375
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# ====================================
# Volúmenes
# ====================================
volumes:
  postgres_data:
    driver: local
  jenkins_home:
    driver: local
