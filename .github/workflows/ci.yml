name: 🎬 Movie BFF CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
      - 'feat/**'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      branch:
        description: 'Rama a construir'
        required: false
        default: 'main'
        type: string

env:
  NODE_VERSION: '20'
  APP_PORT: '3000'
  APP_CONTAINER: 'movie-bff'

jobs:
  build-and-test:
    name: 🏗️ Build & Test
    runs-on: ubuntu-latest
    
    steps:
      - name: ✅ Verificar Herramientas
        run: |
          echo "🔧 Verificando herramientas disponibles..."
          echo "Node.js version:"
          node --version
          echo "npm version:"
          npm --version

      - name: 🔍 Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Instalar Dependencias
        run: |
          echo "📦 Instalando dependencias de Node.js..."
          npm install

      - name: 🔎 Lint (Revisar código)
        run: |
          echo "🔍 Analizando código TypeScript con ESLint..."
          npm run lint || echo "⚠️  Lint encontró advertencias"
        continue-on-error: true

      - name: 🔍 Validar Tipos TypeScript
        run: |
          echo "🔍 Verificando tipos de TypeScript..."
          npm run build:check

      - name: 🧪 Tests
        run: |
          echo "🧪 Ejecutando tests..."
          npx jest --coverage
        continue-on-error: false

      - name: 📤 Subir resultados a Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: 🏗️ Build TypeScript
        run: |
          echo "🏗️  Compilando TypeScript a JavaScript..."
          npm run build

      - name: ✅ Validación Completa
        run: |
          echo "✅ Ejecutando validación completa (lint + types)..."
          npm run validate

      - name: 📋 Verificar Artefactos
        if: always()
        run: |
          echo "🏁 Pipeline finalizado para Movie BFF."
          ls -la dist/ || echo "No hay directorio dist"

      - name: 📤 Subir Artefactos de Build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: movie-bff-dist
          path: dist/
          retention-days: 7

      - name: ✅ Build Exitoso
        if: success()
        run: echo "✅ ¡Build exitoso! El BFF está listo para deployment."

      - name: ❌ Build Fallido
        if: failure()
        run: echo "❌ Build falló. Revisa los logs arriba."

